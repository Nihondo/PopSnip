name: PopSnip
options:
  bundleIdPrefix: com.dmng.popsnip
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "0.9.2"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_ENTITLEMENTS: PopSnip.entitlements

configFiles:
  Debug: Configurations/DevelopmentTeam.xcconfig
  Release: Configurations/DevelopmentTeam.xcconfig

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    majorVersion: 2.9.1

targets:
  PopSnip:
    type: application
    platform: macOS
    sources:
      - path: AppIcon.icon
        buildPhase: resources
      - path: Sources/PopSnipApp
      - path: Sources/PopSnipCore
      - path: Sources/Resources
        buildPhase: resources
        excludes:
          - "Info.plist"
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: PopSnip
        PRODUCT_BUNDLE_IDENTIFIER: com.dmng.popsnip.PopSnip
        INFOPLIST_FILE: Sources/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        # Xcode が xcodebuild 実行時にビルド時自動補完で書き足す2値。project.yml に明示しておかないと
        # xcodegen generate のたびに消え、次の xcodebuild でまた書き足される往復が起きるため固定する。
        # LSApplicationCategoryType は Sources/Resources/Info.plist 側の値と必ず一致させること。
        INFOPLIST_KEY_CFBundleDisplayName: PopSnip
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    scheme:
      testTargets:
        - PopSnipTests
      gatherCoverageData: true

  PopSnipTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PopSnipTests
    dependencies:
      - target: PopSnip
    settings:
      base:
        PRODUCT_NAME: PopSnipTests
        PRODUCT_BUNDLE_IDENTIFIER: com.dmng.popsnip.PopSnipTests
        GENERATE_INFOPLIST_FILE: YES
